<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Less is More</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Tall scroll track: its height (minus one viewport) is the scrub range.
     The pinned inner div sticks to the top of the viewport while the user
     scrolls through it, driving t = 0..1 for the canvas animation. A
     legend card is overlaid on the graphic and its heading/body text is
     swapped by script.js as t crosses each chapter boundary -- NYT-style
     captions that progress alongside the pinned graphic, rather than one
     block of prose parked after it. Same shell as the companion piece,
     "No need to know". -->
<div class="scroll-track" id="scrollTrack">
  <div class="pinned">
    <canvas id="scene"></canvas>
    <!-- An invisible, precisely-positioned/sized circular hit target,
         placed and sized by script.js (layoutTetraGrabZone) to sit
         exactly over the tetrahedron reveal's own rendered shape once
         it's draggable. Its own CSS gives it touch-action: none
         permanently -- see style.css's own note on why splitting this
         out as a *separate* small element, rather than toggling
         touch-action on #scene itself, is what actually lets ordinary
         native scrolling (with full momentum) keep working everywhere
         else on the page, including everywhere else on the canvas. -->
    <div class="tetra-grab-zone" id="tetraGrabZone" hidden></div>
    <!-- Both the legend card and the game's own controls are bottom-
         anchored as *one* flex stack (not two independently absolute-
         positioned elements): when the button row is shown, it should
         sit directly above the legend, growing the stack upward, not
         float at a fixed offset computed independently of the legend's
         own (variable) height -- an earlier version did the latter and
         the button row ended up overlapping the legend body text. -->
    <div class="bottom-stack">
      <!-- "Guess the Door" game controls -- the only new DOM in this
           piece. Plain buttons, shown/hidden by script.js as the game's
           own state machine (not scroll position) progresses; see
           script.js's own "Guess the Door" section for why.

           gameOpenBtn/gameNewRoundBtn (mutually exclusive, exactly one
           hidden at all times) are the *only* normal-flow content of
           .game-controls -- gameRevealBtn is deliberately
           `position: absolute` (see style.css), floating just *above*
           this row without taking up any space in the flow itself.
           Two earlier versions both let "Reveal the cheat sheet"
           appearing alongside "Play again" -- which happens exactly
           once, the very first time a round resolves -- perturb
           "Play again"'s own position and shift it out from under the
           mouse: first horizontally (one shared, centered flex row --
           Reveal's own width pulled the centering off), then when that
           was fixed, vertically instead (Reveal given its own row
           below this one -- its own height pushed this row upward,
           since the whole stack grows upward from a bottom anchor).
           Taking gameRevealBtn out of the flow entirely, in both axes
           at once, is what actually makes "Open selected"/"Play
           again"'s own position depend on *nothing* else in this
           card. -->
      <div class="game-controls" id="gameControls" hidden>
        <button id="gameRevealBtn" class="game-btn" type="button" hidden>Reveal the cheat sheet</button>
        <button id="gameOpenBtn" class="game-btn game-btn-primary" type="button">Open selected</button>
        <button id="gameNewRoundBtn" class="game-btn game-btn-primary" type="button" hidden>Play again</button>
      </div>
      <div class="legend" id="legend">
        <h3 id="legendHeading"></h3>
        <p id="legendBody"></p>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
